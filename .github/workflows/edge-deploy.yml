name: Build, Test e Deploy — Edge AI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrecastr0/yolo-api


jobs:

  # ── JOB 1: Lint e testes unitários / smoke / integration ──
  test:
    name: "Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conecta ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r app/requirements.txt
          pip install pytest ruff

      - name: Download modelo para testes
        run: |
          pip install "dvc[ssh]"
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key
          dvc remote modify --local local_remote keyfile ~/.ssh/dvc_key
          dvc pull

      - name: Disponibiliza o modelo em /app/models (mesmo path usado no Docker)
        run: |
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/models" /app/models
          ls -la /app/models

      - name: Lint (ruff)
        run: ruff check app/

      - name: Testes automatizados
        run: pytest tests/ -v --tb=short


  # ── JOB 2: Build multi-arch e push ───────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3     # emulação ARM64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Quality gate do modelo ────────────────────────
  model-gate:
    name: "Model Quality Gate"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conecta ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instala dependências
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4
          pip install ultralytics==8.2.0 "dvc[ssh]"

      - name: Download modelo via DVC
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key
          dvc remote modify --local local_remote keyfile ~/.ssh/dvc_key
          dvc pull

      - name: Quality Gate
        env:
          TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
        run: |
          python scripts/validate_model.py --threshold 0.50


  # ── JOB 4: Deploy no Raspberry Pi ────────────────────────
  deploy:
    needs: model-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key:      ${{ secrets.RPI_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/yolo-api
            docker compose pull
            docker compose up -d
            sleep 10
            curl -f http://localhost:8000/health || \
              (docker compose down && docker compose up -d --scale yolo-api=0 && exit 1)
